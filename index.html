<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Map Solver — Boolean Logic Minimizer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --bg4: #22222e;
    --border: #2a2a3a;
    --border2: #3a3a50;
    --accent: #4f9eff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #f0f0f8;
    --text2: #9090b0;
    --text3: #5a5a78;
    --cell-size: 68px;
    --glow: 0 0 20px rgba(79,158,255,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,158,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,158,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 3rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    animation: fadeDown 0.6s ease both;
  }

  .logo-area h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }

  .logo-area h1 span {
    color: var(--accent);
  }

  .logo-area p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    margin-top: 6px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.08em;
  }

  /* Main layout */
  .main-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    animation: fadeLeft 0.6s ease 0.1s both;
  }

  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }

  .panel-title {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Variable selector */
  .var-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .var-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 10px 6px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    text-align: center;
  }

  .var-btn:hover { border-color: var(--border2); color: var(--text); }

  .var-btn.active {
    background: rgba(79,158,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(79,158,255,0.1);
  }

  /* Action buttons */
  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .action-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    transition: all 0.15s;
    text-align: center;
  }

  .action-btn:hover { border-color: var(--border2); color: var(--text); background: var(--bg4); }
  .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .action-btn.success:hover { border-color: var(--accent3); color: var(--accent3); }

  /* Truth table preview */
  .truth-table {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    width: 100%;
    border-collapse: collapse;
  }

  .truth-table th {
    color: var(--text3);
    font-weight: 500;
    padding: 4px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .truth-table td {
    color: var(--text2);
    padding: 3px 8px;
    text-align: center;
    font-size: 10px;
  }

  .truth-table tr:hover td { background: var(--bg3); }

  .truth-table td.val-1 { color: var(--accent); font-weight: 700; }
  .truth-table td.val-x { color: var(--warn); }

  /* K-Map area */
  .kmap-section {
    animation: fadeRight 0.6s ease 0.15s both;
  }

  .kmap-container {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    margin-bottom: 1rem;
  }

  .kmap-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .kmap-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.05em;
  }

  .var-indicator {
    display: flex;
    gap: 6px;
  }

  .var-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text3);
  }

  /* K-Map table */
  .kmap-wrapper {
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }

  .kmap-inner {
    display: inline-block;
    position: relative;
  }

  .kmap-axis-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  .kmap-row-wrap {
    display: flex;
    align-items: center;
  }

  .kmap-col-labels {
    display: flex;
    margin-left: 56px;
    margin-bottom: 4px;
  }

  .kmap-col-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    width: var(--cell-size);
    text-align: center;
  }

  .kmap-row-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    width: 50px;
    text-align: right;
    padding-right: 10px;
    flex-shrink: 0;
  }

  .kmap-cells {
    display: grid;
    gap: 0;
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
  }

  .kmap-cell {
    width: var(--cell-size);
    height: var(--cell-size);
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
    background: var(--bg3);
    color: var(--text3);
    user-select: none;
  }

  .kmap-cell:hover { background: var(--bg4); }

  .kmap-cell.val-0 { color: var(--text3); }
  .kmap-cell.val-1 { color: var(--accent); background: rgba(79,158,255,0.05); }
  .kmap-cell.val-x { color: var(--warn); font-size: 14px; }

  .kmap-cell.grouped {
    background: rgba(79,158,255,0.08);
    box-shadow: inset 0 0 0 2px rgba(79,158,255,0.3);
  }

  .kmap-cell.val-1.grouped {
    background: rgba(79,158,255,0.15);
    box-shadow: inset 0 0 0 2px rgba(79,158,255,0.5);
  }

  .kmap-cell .minterm {
    position: absolute;
    top: 4px;
    left: 5px;
    font-size: 8px;
    color: var(--text3);
    font-weight: 400;
    opacity: 0.5;
  }

  /* Result panel */
  .result-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: border-color 0.3s;
  }

  .result-panel.has-result { border-color: rgba(79,158,255,0.3); }

  .result-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .result-label {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .result-expr {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
    min-height: 28px;
    word-break: break-all;
  }

  .result-expr .term {
    display: inline;
  }

  .result-expr .complement {
    text-decoration: overline;
    text-decoration-color: var(--accent);
  }

  .copy-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 16px;
  }

  .copy-btn:hover { border-color: var(--border2); color: var(--text); }
  .copy-btn.copied { border-color: var(--accent3); color: var(--accent3); }

  /* Groups visualization */
  .groups-section {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .group-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: popIn 0.2s ease both;
  }

  .group-chip .chip-size {
    font-size: 9px;
    opacity: 0.7;
    letter-spacing: 0.05em;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    display: block;
  }

  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Responsive */
  @media (max-width: 800px) {
    .main-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    :root { --cell-size: 56px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Tooltip */
  .tooltip {
    position: relative;
  }
  .tooltip::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg4);
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 5px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  .tooltip:hover::after { opacity: 1; }

  /* Group colors */
  .gc0 { border-color: #4f9eff55; background: #4f9eff10; color: #7ab8ff; }
  .gc1 { border-color: #10b98155; background: #10b98110; color: #34d399; }
  .gc2 { border-color: #f59e0b55; background: #f59e0b10; color: #fbbf24; }
  .gc3 { border-color: #ef444455; background: #ef444410; color: #f87171; }
  .gc4 { border-color: #a78bfa55; background: #a78bfa10; color: #c4b5fd; }
  .gc5 { border-color: #f4725655; background: #f4725610; color: #fb8a6e; }
  .gc6 { border-color: #22d3ee55; background: #22d3ee10; color: #67e8f9; }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    text-align: center;
    margin-top: 0.75rem;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo-area">
      <h1>K-Map <span>Solver</span></h1>
      <p>Boolean Logic Minimizer · SOP Simplification</p>
    </div>
    <div class="badge">v2.0 · Quine–McCluskey</div>
  </header>

  <div class="main-grid">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="panel">
        <div class="panel-title">Variables</div>
        <div class="var-buttons">
          <button class="var-btn" onclick="setVars(2)">2-var<br><small style="font-size:9px;opacity:0.5">A,B</small></button>
          <button class="var-btn" onclick="setVars(3)">3-var<br><small style="font-size:9px;opacity:0.5">A,B,C</small></button>
          <button class="var-btn active" onclick="setVars(4)">4-var<br><small style="font-size:9px;opacity:0.5">A,B,C,D</small></button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Actions</div>
        <div class="action-grid">
          <button class="action-btn danger" onclick="clearAll()">Clear All</button>
          <button class="action-btn success" onclick="fillRandom()">Random</button>
          <button class="action-btn" onclick="fillAllOnes()">All 1s</button>
          <button class="action-btn" onclick="fillAllZeros()">All 0s</button>
          <button class="action-btn" style="grid-column:1/-1" onclick="invertAll()">Invert</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Truth Table</div>
        <div style="overflow-y:auto;max-height:240px;">
          <table class="truth-table" id="truth-table">
            <thead id="tt-head"></thead>
            <tbody id="tt-body"></tbody>
          </table>
        </div>
      </div>

    </aside>

    <!-- Main content -->
    <main class="kmap-section">

      <!-- Stats -->
      <div class="stats-row" id="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-ones">0</span>
          <span class="stat-label">Minterms</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-zeros">16</span>
          <span class="stat-label">Maxterms</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-dc">0</span>
          <span class="stat-label">Don't Cares</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-terms">0</span>
          <span class="stat-label">SOP Terms</span>
        </div>
      </div>

      <!-- K-Map -->
      <div class="kmap-container">
        <div class="kmap-header">
          <h2 id="kmap-heading">Karnaugh Map — 4 Variables</h2>
          <div class="var-indicator" id="var-indicator"></div>
        </div>
        <div class="kmap-wrapper">
          <div class="kmap-inner" id="kmap-inner"></div>
        </div>
        <p class="hint">Tap a cell to cycle values: 0 → 1 → X</p>
      </div>

      <!-- Result -->
      <div class="result-panel" id="result-panel">
        <div class="result-top">
          <div>
            <div class="result-label">Minimized SOP Expression — F(…)</div>
            <div class="result-expr" id="result-expr">—</div>
          </div>
          <button class="copy-btn" id="copy-btn" onclick="copyExpr()">Copy</button>
        </div>
        <div class="groups-section" id="groups-section"></div>
      </div>

    </main>
  </div>
</div>

<script>
  // ─── State ───────────────────────────────────────────────────────
  let nVars = 4;
  let cells = [];

  const VAR_NAMES = ['A','B','C','D'];
  const GRAY2 = ['00','01','11','10'];
  const GRAY4 = ['00','01','11','10'];

  // Group colors for chip display
  const GROUP_COLORS = ['gc0','gc1','gc2','gc3','gc4','gc5','gc6'];

  // ─── Init ─────────────────────────────────────────────────────────
  function init() {
    const count = 1 << nVars;
    cells = Array(count).fill(0);
    render();
  }

  // ─── Variable count ───────────────────────────────────────────────
  function setVars(n) {
    nVars = n;
    document.querySelectorAll('.var-btn').forEach((b,i) => b.classList.toggle('active', [2,3,4][i] === n));
    init();
  }

  // ─── Cell cycle ──────────────────────────────────────────────────
  function toggleCell(idx) {
    const nextValue = {0: 1, 1: 'x', x: 0};
    cells[idx] = nextValue[cells[idx]];
    render();
  }

  // ─── Actions ─────────────────────────────────────────────────────
  function clearAll() { cells = Array(1<<nVars).fill(0); render(); }
  function fillAllOnes() { cells = Array(1<<nVars).fill(1); render(); }
  function fillAllZeros() { cells = Array(1<<nVars).fill(0); render(); }
  function invertAll() {
    cells = cells.map(v => v === 0 ? 1 : v === 1 ? 0 : 'x');
    render();
  }
  function fillRandom() {
    cells = Array(1<<nVars).fill(0).map(() => {
      const r = Math.random();
      return r < 0.4 ? 1 : r < 0.55 ? 'x' : 0;
    });
    render();
  }

  // ─── Gray code helpers ───────────────────────────────────────────
  function grayCode(i, bits) {
    const g = i ^ (i >> 1);
    return g.toString(2).padStart(bits, '0');
  }

  // Get all gray codes for a given variable count
  function getGrayCodes(bits) {
    return Array.from({length: 1<<bits}, (_,i) => grayCode(i, bits));
  }

  // Map (row, col) → minterm index based on layout
  function rcToMinterm(r, c) {
    if (nVars === 2) {
      // rows: A (1 bit), cols: B (1 bit)
      const rg = grayCode(r, 1);
      const cg = grayCode(c, 1);
      return parseInt(rg + cg, 2);
    } else if (nVars === 3) {
      // rows: AB (2 bits), cols: C (1 bit)
      const rg = grayCode(r, 2);
      const cg = grayCode(c, 1);
      return parseInt(rg + cg, 2);
    } else {
      // rows: AB (2 bits), cols: CD (2 bits)
      const rg = grayCode(r, 2);
      const cg = grayCode(c, 2);
      return parseInt(rg + cg, 2);
    }
  }

  function getLayout() {
    if (nVars === 2) return { rows: 2, cols: 2, rowBits: 1, colBits: 1, rowVars: 'A', colVars: 'B' };
    if (nVars === 3) return { rows: 4, cols: 2, rowBits: 2, colBits: 1, rowVars: 'AB', colVars: 'C' };
    return { rows: 4, cols: 4, rowBits: 2, colBits: 2, rowVars: 'AB', colVars: 'CD' };
  }

  // ─── Render K-Map ────────────────────────────────────────────────
  function render() {
    const { rows, cols, rowBits, colBits, rowVars, colVars } = getLayout();

    // Solve first to get groups
    const { expression, chosen, terms } = solve();

    // Build grouped minterm set
    const groupedMinterms = new Set();
    chosen.forEach(g => g.forEach(m => groupedMinterms.add(m)));

    // Build HTML
    let html = '';

    // Col axis label
    html += `<div class="kmap-axis-label" style="margin-left:50px">${colVars} →</div>`;

    // Col labels
    html += `<div style="display:flex;margin-left:50px;">`;
    for (let c = 0; c < cols; c++) {
      html += `<div class="kmap-col-label">${grayCode(c, colBits)}</div>`;
    }
    html += `</div>`;

    // Rows
    for (let r = 0; r < rows; r++) {
      html += `<div class="kmap-row-wrap">`;
      const rowLabel = r === 0 ? `<span style="font-size:9px;display:block;color:var(--text3);margin-bottom:2px">${rowVars}↓</span>` : '';
      html += `<div class="kmap-row-label">${rowLabel}${grayCode(r, rowBits)}</div>`;
      html += `<div style="display:grid;grid-template-columns:repeat(${cols},var(--cell-size));">`;
      for (let c = 0; c < cols; c++) {
        const m = rcToMinterm(r, c);
        const v = cells[m];
        const isGrouped = groupedMinterms.has(m) && v === 1;
        const cls = `kmap-cell val-${v}${isGrouped ? ' grouped' : ''}`;
        const display = v === 'x' ? 'X' : v;
        html += `<div class="${cls}" onclick="toggleCell(${m})" title="m${m}: tap to cycle 0 → 1 → X">
          <span class="minterm">${m}</span>${display}</div>`;
      }
      html += `</div></div>`;
    }

    document.getElementById('kmap-inner').innerHTML = html;

    // Heading
    const varStr = VAR_NAMES.slice(0, nVars).join(',');
    document.getElementById('kmap-heading').textContent = `Karnaugh Map — ${nVars} Variable${nVars>1?'s':''}`;

    // Var indicator
    document.getElementById('var-indicator').innerHTML = VAR_NAMES.slice(0, nVars)
      .map(v => `<span class="var-tag">${v}</span>`).join('');

    // Stats
    const ones = cells.filter(c => c === 1).length;
    const zeros = cells.filter(c => c === 0).length;
    const dcs = cells.filter(c => c === 'x').length;
    document.getElementById('stat-ones').textContent = ones;
    document.getElementById('stat-zeros').textContent = zeros;
    document.getElementById('stat-dc').textContent = dcs;
    document.getElementById('stat-terms').textContent = chosen.length;

    // Expression
    const exprEl = document.getElementById('result-expr');
    exprEl.textContent = expression;
    document.getElementById('result-panel').classList.toggle('has-result', expression !== '—' && expression !== '0' && expression !== '1');

    // Groups chips
    const gs = document.getElementById('groups-section');
    if (chosen.length === 0) {
      gs.innerHTML = '';
    } else {
      gs.innerHTML = chosen.map((g, i) => {
        const t = terms[i];
        const sz = g.length;
        return `<div class="group-chip ${GROUP_COLORS[i % GROUP_COLORS.length]}">
          <span>${t || '1'}</span>
          <span class="chip-size">×${sz}</span>
        </div>`;
      }).join('');
    }

    // Truth table
    renderTruthTable();
  }

  // ─── Truth Table ─────────────────────────────────────────────────
  function renderTruthTable() {
    const vars = VAR_NAMES.slice(0, nVars);
    document.getElementById('tt-head').innerHTML =
      `<tr>${vars.map(v=>`<th>${v}</th>`).join('')}<th>F</th></tr>`;

    const count = 1 << nVars;
    let rows = '';
    for (let m = 0; m < count; m++) {
      const bits = m.toString(2).padStart(nVars, '0').split('');
      const v = cells[m];
      const vc = v === 1 ? 'val-1' : v === 'x' ? 'val-x' : '';
      const disp = v === 'x' ? 'X' : v;
      rows += `<tr>${bits.map(b=>`<td>${b}</td>`).join('')}<td class="${vc}">${disp}</td></tr>`;
    }
    document.getElementById('tt-body').innerHTML = rows;
  }

  // ─── Copy ────────────────────────────────────────────────────────
  function copyExpr() {
    const expr = document.getElementById('result-expr').textContent;
    navigator.clipboard.writeText(expr).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    });
  }

  // ─── Solver ──────────────────────────────────────────────────────
  function solve() {
    const ones = [], dcs = [];
    cells.forEach((v, i) => { if (v === 1) ones.push(i); else if (v === 'x') dcs.push(i); });

    const total = 1 << nVars;

    if (ones.length === 0) return { expression: '0', chosen: [], terms: [] };
    if (ones.length + dcs.length === total) return { expression: '1', chosen: [], terms: [] };

    const all = [...ones, ...dcs];
    const groups = findAllGroups(all, ones);
    const essential = getEssentialGroups(groups, ones);

    // Cover all minterms
    const covered = new Set();
    const chosen = [];
    essential.forEach(g => { g.forEach(m => covered.add(m)); chosen.push(g); });

    ones.forEach(m => {
      if (!covered.has(m)) {
        const best = groups
          .filter(g => g.includes(m))
          .sort((a, b) => b.length - a.length)[0];
        if (best && !chosen.some(c => arrEq(c, best))) {
          best.forEach(x => covered.add(x));
          chosen.push(best);
        }
      }
    });

    const terms = chosen.map(g => groupToTerm(g));
    const expression = terms.length ? terms.join(' + ') : '0';

    return { expression, chosen, terms };
  }

  function findAllGroups(all, ones) {
    const groups = [];
    const sizes = Array.from({length: nVars + 1}, (_, i) => 1 << i).reverse();

    sizes.forEach(sz => {
      const combos = getCombinations(all, sz);
      combos.forEach(combo => {
        if (isValidKmapGroup(combo) && combo.some(m => ones.includes(m))) {
          groups.push([...combo].sort((a,b) => a-b));
        }
      });
    });

    // Deduplicate
    const seen = new Set();
    return groups.filter(g => {
      const key = g.join(',');
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function isValidKmapGroup(group) {
    const sz = group.length;
    if (sz === 0 || (sz & (sz - 1)) !== 0) return false;
    const n = nVars;
    const mask = (1 << n) - 1;

    let onesBits = group[0];
    let zerosBits = ~group[0] & mask;
    group.forEach(m => { onesBits &= m; zerosBits &= (~m & mask); });

    const fixedBits = onesBits | zerosBits;
    const freeBits = n - popcount(fixedBits);
    if ((1 << freeBits) !== sz) return false;

    const expected = [];
    for (let i = 0; i < (1 << n); i++) {
      if ((i & fixedBits) === onesBits) expected.push(i);
    }

    return expected.length === sz &&
      expected.every(e => group.includes(e)) &&
      group.every(g => expected.includes(g));
  }

  function getCombinations(arr, sz) {
    if (sz === 1) return arr.map(a => [a]);
    if (sz > arr.length) return [];
    const res = [];
    function pick(start, cur) {
      if (cur.length === sz) { res.push([...cur]); return; }
      for (let i = start; i < arr.length; i++) {
        cur.push(arr[i]);
        pick(i + 1, cur);
        cur.pop();
      }
    }
    pick(0, []);
    return res;
  }

  function getEssentialGroups(groups, ones) {
    const essential = [];
    ones.forEach(m => {
      const covering = groups.filter(g => g.includes(m));
      if (covering.length === 1 && !essential.some(e => arrEq(e, covering[0]))) {
        essential.push(covering[0]);
      }
    });
    return essential;
  }

  function groupToTerm(group) {
    const n = nVars;
    const mask = (1 << n) - 1;
    let onesBits = group[0];
    let zerosBits = ~group[0] & mask;
    group.forEach(m => { onesBits &= m; zerosBits &= (~m & mask); });

    let term = '';
    for (let i = n - 1; i >= 0; i--) {
      const varIdx = n - 1 - i;
      if (onesBits & (1 << i)) term += VAR_NAMES[varIdx];
      else if (zerosBits & (1 << i)) term += VAR_NAMES[varIdx] + "'";
    }
    return term || '1';
  }

  function popcount(x) { let c = 0; while (x) { c += x & 1; x >>= 1; } return c; }
  function arrEq(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }

  // ─── Boot ────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
